# Alembic configuration. The DB URL is injected from app settings in env.py
# (do NOT put the real DATABASE_URL here — it lives in .env).

[alembic]
script_location = alembic
prepend_sys_path = .
# Use OS-native path separators and UTC timestamps in revision filenames.
path_separator = os
timezone = UTC
# Revision filename template: <date>_<slug>_<rev>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s_%%(rev)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
